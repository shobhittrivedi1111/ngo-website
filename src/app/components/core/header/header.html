<header class="sticky top-0 z-50 bg-white shadow-sm">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
    <!-- <a routerLink="/" (click)="close()" class="text-lg font-bold leading-tight text-teal-800">
      {{ ngo.name }}
      <span class="block text-xs font-normal text-gray-500">{{ ngo.nameHindi }}</span>
    </a> -->
    <a routerLink="/" (click)="close()" class="flex items-center gap-3">
  <!-- NGO Logo -->
  <img src="/ngologo.png" alt="Naya Savera Utthan Welfare Society" class="h-12 w-12 object-contain"/>

  <!-- NGO Name -->
  <div class="leading-tight">
    <div class="text-lg font-bold text-teal-800">
      {{ ngo.name }}
    </div>

    <span class="block text-xs font-normal text-gray-500">
      {{ ngo.nameHindi }}
    </span>
  </div>
</a>

    <nav class="hidden items-center gap-6 lg:flex">
      @for (l of links; track l.path) {
        <a [routerLink]="l.path" routerLinkActive="text-orange-600 font-semibold"
           [routerLinkActiveOptions]="{ exact: true }"
           class="text-sm text-gray-700 hover:text-orange-600">{{ l.label }}</a>
      }
      <a routerLink="/donate"
         class="rounded-full bg-orange-600 px-5 py-2 text-sm font-semibold text-white hover:bg-orange-700">Donate</a>
    </nav>

    <button class="lg:hidden" (click)="toggle()" aria-label="Menu">
      <span class="text-2xl">{{ open() ? '✕' : '☰' }}</span>
    </button>
  </div>

  @if (open()) {
    <nav class="flex flex-col gap-1 border-t bg-white px-4 py-3 lg:hidden">
      @for (l of links; track l.path) {
        <a [routerLink]="l.path" (click)="close()" class="py-2 text-gray-700">{{ l.label }}</a>
      }
      <a routerLink="/donate" (click)="close()"
         class="mt-2 rounded-full bg-orange-600 px-5 py-2 text-center font-semibold text-white">Donate</a>
    </nav>
  }
</header>
