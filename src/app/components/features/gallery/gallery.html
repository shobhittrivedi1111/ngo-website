<section class="bg-teal-50 py-16">
  <div class="mx-auto max-w-4xl px-4 text-center">
    <p class="text-sm font-semibold uppercase tracking-widest text-orange-600">Moments</p>
    <h1 class="mt-3 text-4xl font-bold text-teal-900">Gallery</h1>
  </div>
</section>

<section class="mx-auto max-w-6xl px-4 py-16">
  @if (photos.length === 0) {
    <p class="text-center text-gray-500">Photos coming soon.</p>
  } @else {
    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (p of photos; track p.src) {
        <button (click)="open(p)" class="group overflow-hidden rounded-xl border bg-white shadow-sm">
          <img [src]="p.src" [alt]="p.caption"
               class="h-48 w-full object-cover transition group-hover:scale-105" />
          <p class="p-3 text-left text-sm text-gray-600">{{ p.caption }}</p>
        </button>
      }
    </div>
  }
</section>

<!-- Lightbox -->
@if (active()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4" (click)="close()">
    <div class="max-w-3xl">
      <img [src]="active()!.src" [alt]="active()!.caption" class="max-h-[80vh] w-full rounded-lg object-contain" />
      <p class="mt-3 text-center text-white">{{ active()!.caption }}</p>
    </div>
  </div>
}
