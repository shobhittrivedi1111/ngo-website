<section class="bg-teal-50 py-16">
  <div class="mx-auto max-w-4xl px-4 text-center">
    <p class="text-sm font-semibold uppercase tracking-widest text-orange-600">What's happening</p>
    <h1 class="mt-3 text-4xl font-bold text-teal-900">Upcoming events</h1>
  </div>
</section>

<section class="mx-auto max-w-3xl px-4 py-16">
  <div class="space-y-6">
    @for (e of events; track e.title) {
      <div class="rounded-2xl border bg-white p-6 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h2 class="text-xl font-semibold text-teal-900">{{ e.title }}</h2>
          @if (isPast(e.date)) {
            <span class="rounded-full bg-gray-100 px-3 py-1 text-xs font-medium text-gray-500">Completed</span>
          } @else {
            <span class="rounded-full bg-orange-100 px-3 py-1 text-xs font-medium text-orange-700">Upcoming</span>
          }
        </div>
        <p class="mt-1 text-sm text-gray-500">
          {{ e.date | date: 'mediumDate' }} · {{ e.location }}
        </p>
        <p class="mt-3 text-gray-700">{{ e.description }}</p>
      </div>
    } @empty {
      <p class="text-center text-gray-500">No events scheduled right now. Check back soon.</p>
    }
  </div>
</section>
