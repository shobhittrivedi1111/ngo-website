<section class="bg-gradient-to-br from-orange-50 to-teal-50">
  <div class="mx-auto max-w-6xl px-4 py-20 text-center">
    <p class="text-sm font-semibold uppercase tracking-widest text-orange-600">Lucknow, Uttar Pradesh</p>
    <h1 class="mt-3 text-4xl font-bold text-teal-900 md:text-5xl">A new dawn for every family</h1>
    <p class="mx-auto mt-4 max-w-2xl text-lg text-gray-600">
      {{ ngo.name }} works for education, health and self-reliance in our community.
    </p>
    <div class="mt-8 flex flex-wrap justify-center gap-4">
      <a routerLink="/donate" class="rounded-full bg-orange-600 px-8 py-3 font-semibold text-white hover:bg-orange-700">Donate now</a>
      <a routerLink="/membership" class="rounded-full border-2 border-teal-700 px-8 py-3 font-semibold text-teal-800 hover:bg-teal-50">Become a member</a>
    </div>
  </div>
</section>

<section class="mx-auto max-w-6xl px-4 py-16">
  <h2 class="text-center text-3xl font-bold text-teal-900">What we do</h2>
  <div class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (p of programs; track p.title) {
      <div class="rounded-2xl border bg-white p-6 shadow-sm">
        <div class="text-3xl">{{ p.icon }}</div>
        <h3 class="mt-3 text-lg font-semibold text-teal-800">{{ p.title }}</h3>
        <p class="mt-1 text-sm text-gray-600">{{ p.text }}</p>
      </div>
    }
  </div>
</section>
