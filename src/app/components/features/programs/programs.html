<section class="bg-teal-50 py-16">
  <div class="mx-auto max-w-4xl px-4 text-center">
    <p class="text-sm font-semibold uppercase tracking-widest text-orange-600">Our work</p>
    <h1 class="mt-3 text-4xl font-bold text-teal-900">Programs & initiatives</h1>
  </div>
</section>

<section class="mx-auto max-w-3xl px-4 py-16">
  <ol class="space-y-4">
    @for (o of objectives; track o; let i = $index) {
      <li class="flex gap-4 rounded-xl border bg-white p-4 shadow-sm">
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-orange-100 font-bold text-orange-700">
          {{ i + 1 }}
        </span>
        <p class="text-gray-700">{{ o }}</p>
      </li>
    }
  </ol>
</section>
