<section class="bg-teal-50 py-16">
  <div class="mx-auto max-w-4xl px-4 text-center">
    <p class="text-sm font-semibold uppercase tracking-widest text-orange-600">Support us</p>
    <h1 class="mt-3 text-4xl font-bold text-teal-900">Donate</h1>
    <p class="mx-auto mt-4 max-w-xl text-gray-600">
      Your contribution helps us run education, health and welfare programs across Lucknow.
    </p>
  </div>
</section>

<section class="mx-auto max-w-md px-4 py-16 text-center">
  <div class="rounded-2xl border bg-white p-8 shadow-sm">
    <p class="text-sm font-semibold text-gray-500">Scan to pay via any UPI app</p>

     <img src="upi-qr.png" class="mx-auto mt-4 w-full max-w-xs rounded-xl border"/>

    <p class="mt-4 font-semibold text-teal-900">{{ ngo.upi.payeeName }}</p>
    <div class="mt-2 flex flex-col items-center justify-center gap-2 sm:flex-row">
  <code class="max-w-full break-all rounded bg-gray-100 px-3 py-1 text-sm">{{ ngo.upi.vpa }}</code>
  <button (click)="copyVpa()" class="text-sm font-medium text-orange-600 hover:underline">
    {{ copied() ? 'Copied!' : 'Copy' }}
  </button>
</div>

    <p class="mt-6 text-xs text-gray-500">
      Registered under the {{ ngo.registration.act }} · Reg. No: {{ ngo.registration.number }}
    </p>
  </div>
</section>
